name: Release

# Builds the zexoro CLI with Native AOT for every supported RID, each on a runner of that operating
# system and architecture with the pinned toolset embedded (eng/toolsets.json) and the updaters for
# every runtime identifier (built by the 'updater' jobs, eng/Updater.targets), smoke-tests
# every binary where it was built, and publishes the archives plus SHA256SUMS as a GitHub release.
#
# - Tag v<version> (for example v0.1.0): builds and publishes the release <version>.
# - Pull requests that change this workflow or eng/, and manual runs with dry-run (the default):
#   build, test and package everything exactly as a release would, but publish nothing.
#   Their version is <VersionPrefix>-dryrun.<run number>.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - eng/**
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and package without publishing (publishing also needs a v* tag as the ref)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "v$version" != "$GITHUB_REF_NAME" ] || ! [[ "$version" =~ $semver ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
              exit 1
            fi
            publish=$([ "$DRY_RUN" = true ] && echo false || echo true)
          else
            prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
            version="$prefix-dryrun.$GITHUB_RUN_NUMBER"
            publish=false
          fi
          # 0.x versions and SemVer pre-releases are published as GitHub pre-releases.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version publish=$publish prerelease=$prerelease"
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # zexoro-updater for every runtime identifier with the release version (which a release's
  # minimumUpdater is compared with), embedded into every CLI build. As in ci.yml, each leg builds
  # on a runner of its own system and architecture (Linux in a container of an old distribution,
  # eng/updater/publish-in-container.sh) and the 'updater' job merges them.
  updater-build:
    name: updater (${{ matrix.leg }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            os: windows-latest
          - leg: linux-x64
            os: ubuntu-24.04
          - leg: linux-arm64
            os: ubuntu-24.04-arm
          - leg: osx-arm64
            os: macos-15
          - leg: osx-x64
            os: macos-15-intel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        if: runner.os != 'Linux'
        with:
          global-json-file: global.json

      # publish.sh sets the version from VERSION and checks that --version prints exactly it.
      - name: Publish zexoro-updater (Native AOT)
        shell: bash
        run: |
          set -euo pipefail
          echo "### zexoro-updater $VERSION (${{ matrix.leg }})" >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.leg }}" in
            windows)
              for rid in win-x86 win-x64; do eng/updater/publish.sh "$rid" artifacts/updater; done
              eng/updater/publish.sh win-arm64 artifacts/updater norun ;;
            linux-*)
              arch="${{ matrix.leg }}"; arch="${arch#linux-}"
              eng/updater/publish-in-container.sh "linux-$arch" artifacts/updater
              eng/updater/publish-in-container.sh "linux-musl-$arch" artifacts/updater ;;
            osx-*)
              eng/updater/publish.sh "${{ matrix.leg }}" artifacts/updater ;;
          esac
          ls -l artifacts/updater

      # Not named zexoro-*: the checksums job collects those as release files.
      - uses: actions/upload-artifact@v4
        with:
          name: updater-leg-${{ matrix.leg }}
          path: artifacts/updater
          if-no-files-found: error

  updater:
    name: updater
    needs: updater-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-leg-*
          path: artifacts/updater
          merge-multiple: true

      - name: Check and checksum every updater
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/updater
          expected="zexoro-updater-linux-arm64
          zexoro-updater-linux-musl-arm64
          zexoro-updater-linux-musl-x64
          zexoro-updater-linux-x64
          zexoro-updater-osx-arm64
          zexoro-updater-osx-x64
          zexoro-updater-win-arm64.exe
          zexoro-updater-win-x64.exe
          zexoro-updater-win-x86.exe"
          actual=$(ls | sort)
          if [ "$actual" != "$(echo "$expected" | sed 's/^ *//')" ]; then
            echo "::error::unexpected updater files:"$'\n'"$actual"
            exit 1
          fi
          sha256sum zexoro-updater-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater
          if-no-files-found: error

  build:
    name: ${{ matrix.rid }}
    needs: [version, updater]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
          - rid: win-x64
            os: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/zexoro-toolsets
          key: zexoro-toolsets-${{ hashFiles('eng/toolsets.json') }}

      - uses: actions/download-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater

      # Version sets the informational version that 'zexoro --version' prints; without the source
      # revision it is exactly the release version. A release must embed every updater.
      - name: Publish (Native AOT)
        shell: bash
        run: >
          dotnet publish src/Zexoro.Cli -c Release -r "$RID" -o artifacts/publish
          -p:Version="$VERSION" -p:IncludeSourceRevisionInInformationalVersion=false
          -p:ZexoroUpdaterDir=artifacts/updater -p:ZexoroUpdaterRequired=true

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          exe=zexoro; [ "$RUNNER_OS" = Windows ] && exe=zexoro.exe
          cli="$PWD/artifacts/publish/$exe"
          file "$cli" || true

          actual=$("$cli" --version | tr -d '\r')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::zexoro --version printed '$actual', expected '$VERSION'"
            exit 1
          fi
          echo "version: $actual"

          nsis=$(jq -r .nsis.version eng/toolsets.json)
          work="$(mktemp -d)"
          export ZEXORO_CACHE_DIR="$work/cache"
          cd "$work"
          "$cli" init
          set +e; "$cli" doctor > doctor.log; set -e
          cat doctor.log
          if ! grep -Eq "^ok +bundled NSIS $nsis: makensis" doctor.log; then
            echo "::error::doctor does not report the bundled NSIS $nsis as ok"
            exit 1
          fi
          for updater in win-x86 win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64; do
            if ! grep -Eq "^ok +bundled updater for $updater " doctor.log; then
              echo "::error::doctor does not report the bundled updater for $updater as ok"
              exit 1
            fi
          done
          tools=$(ls -d "$ZEXORO_CACHE_DIR"/toolsets/nsis-*)
          if [ "$RUNNER_OS" = Linux ]; then
            # The README states the glibc the CLI needs; the bundled makensis must stay static.
            glibc=$(objdump -T "$cli" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "zexoro needs $glibc"
            if ! file "$tools/Bin/makensis" | grep -Eq 'statically linked|static-pie linked'; then
              echo "::error::the bundled makensis is not statically linked"
              exit 1
            fi
          fi

          # Pack and sign an installer, which runs the embedded makensis and calls this binary
          # back through sign-file. Any small PE file serves as the application.
          mkdir -p app assets
          cp "$tools/Plugins/x86-unicode/System.dll" app/App.exe
          cp "$tools/Contrib/Graphics/Icons/modern-install.ico" assets/app.ico
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes \
            -subj "/CN=zexoro release smoke" -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out cert.pfx -passout pass:smoke
          cat > zexoro.toml <<'TOML'
          [app]
          id = "com.example.smoke"
          name = "Smoke Test"
          version = "1.0.0"
          publisher = "zexoro"
          icon = "assets/app.ico"

          [input]
          dir = "app"
          main = "App.exe"

          [windows]

          [windows.signing]
          certificate = "cert.pfx"
          password = { env = "SMOKE_PASSWORD" }
          TOML
          SMOKE_PASSWORD=smoke "$cli" pack --version 1.2.3
          installer=dist/SmokeTest-1.2.3-win-x86.exe
          test -f "$installer"
          test "$(head -c 2 "$installer")" = "MZ"

      # This runner's zexoro-updater builds against a local feed: check, download and apply of a
      # tar.gz, the musl build in Alpine (tests/e2e/unix/check-updater.sh).
      - name: Smoke test zexoro-updater
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cli=artifacts/publish/zexoro
          ls -l "$cli"
          echo "zexoro $VERSION ($RID): $(wc -c < "$cli" | tr -d ' ') bytes" >> "$GITHUB_STEP_SUMMARY"
          tests/e2e/unix/check-updater.sh "$cli" "artifacts/updater/zexoro-updater-$RID"
          if [ "$RUNNER_OS" = Linux ]; then
            export TMPDIR=/tmp
            tests/e2e/unix/check-updater.sh "$cli" "artifacts/updater/zexoro-updater-linux-musl-${RID#linux-}" \
              docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME -e XDG_STATE_HOME -e TMPDIR -v /tmp:/tmp alpine:3.21
          fi

      - name: Archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage artifacts/dist
          cp LICENSE artifacts/stage/
          name="zexoro-$VERSION-$RID"
          if [ "$RUNNER_OS" = Windows ]; then
            cp artifacts/publish/zexoro.exe artifacts/stage/
            pwsh -NoProfile -Command "Compress-Archive -Path artifacts/stage/* -DestinationPath artifacts/dist/$name.zip"
            archive="artifacts/dist/$name.zip"
          else
            cp artifacts/publish/zexoro artifacts/stage/
            chmod 755 artifacts/stage/zexoro
            tar -czf "artifacts/dist/$name.tar.gz" -C artifacts/stage zexoro LICENSE
            archive="artifacts/dist/$name.tar.gz"
          fi
          ls -l artifacts/dist

          # The archive itself must contain a working binary.
          check="$(mktemp -d)"
          case "$archive" in
            *.zip)
              pwsh -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath '$(cygpath -w "$check")'"
              exe="$check/zexoro.exe" ;;
            *) tar -xzf "$archive" -C "$check"; exe="$check/zexoro" ;;
          esac
          test "$("$exe" --version | tr -d '\r')" = "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: zexoro-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zexoro-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "zexoro-$VERSION-linux-arm64.tar.gz"
            "zexoro-$VERSION-linux-x64.tar.gz"
            "zexoro-$VERSION-osx-arm64.tar.gz"
            "zexoro-$VERSION-osx-x64.tar.gz"
            "zexoro-$VERSION-win-x64.zip"
          )
          actual=$(ls | sort)
          if [ "$actual" != "$(printf '%s\n' "${expected[@]}")" ]; then
            echo "::error::unexpected release files:"$'\n'"$actual"
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, checksums]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Create the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "zexoro $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" "${flags[@]}" dist/*
