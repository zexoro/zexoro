name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # zexoro-updater for every Windows architecture, published once with Native AOT (which can
  # cross-compile between architectures of one operating system, not between systems) and
  # embedded into every CLI build (docs/design/0005-nsis-updates.md section 3).
  updater:
    name: updater
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish zexoro-updater (Native AOT)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/updater
          for rid in win-x86 win-x64 win-arm64; do
            dotnet publish src/Zexoro.Updater -c Release -r "$rid" -o "artifacts/updater-publish/$rid"
            cp "artifacts/updater-publish/$rid/zexoro-updater.exe" "artifacts/updater/zexoro-updater-$rid.exe"
          done
          cd artifacts/updater
          sha256sum zexoro-updater-*.exe > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Smoke test zexoro-updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $machines = @{ 'win-x86' = 0x014C; 'win-x64' = 0x8664; 'win-arm64' = 0xAA64 }
          foreach ($rid in $machines.Keys) {
            $exe = "artifacts/updater/zexoro-updater-$rid.exe"
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne $machines[$rid]) { throw ("{0}: PE machine 0x{1:X4}" -f $rid, $machine) }
            # The manifest must say asInvoker, or Windows' installer detection elevates an
            # executable whose name contains 'update'.
            if (-not ([Text.Encoding]::ASCII.GetString($bytes).Contains('level="asInvoker"'))) { throw "$rid has no asInvoker manifest" }
            Write-Host "$rid ok ($($bytes.Length) bytes)"
          }
          # x64 and x86 run on the runner; outside an install the updater asks for a manual update (7).
          foreach ($rid in 'win-x64', 'win-x86') {
            $exe = Resolve-Path "artifacts/updater/zexoro-updater-$rid.exe"
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw "$rid --version failed" }
            & $exe check --json
            if ($LASTEXITCODE -ne 7) { throw "$rid check outside an install exited $LASTEXITCODE, expected 7" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Toolset archives pinned in eng/toolsets.json, downloaded by the build (see eng/Toolsets.targets).
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/zexoro-toolsets
          key: zexoro-toolsets-${{ hashFiles('eng/toolsets.json') }}

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish CLI (Native AOT)
        run: dotnet publish src/Zexoro.Cli -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=artifacts/publish/${{ matrix.rid }}/zexoro
          "$cli" --version
          "$cli" --help
          if "$cli" --bogus; then
            echo "expected a non-zero exit code for unknown arguments" >&2
            exit 1
          fi
          cli="$PWD/$cli"
          work="$(mktemp -d)"
          cd "$work"
          "$cli" init
          test -f zexoro.toml
          set +e
          "$cli" doctor
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected doctor to exit 1 for a fresh template (missing input files), got $status" >&2
            exit 1
          fi

      # Packs and signs an installer with the Native AOT binary, which extracts its embedded NSIS
      # toolset and calls itself back (sign-file) from makensis. Any small PE file serves as the app.
      - name: Smoke test pack
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/artifacts/publish/${{ matrix.rid }}/zexoro"
          work="$(mktemp -d)"
          export ZEXORO_CACHE_DIR="$work/cache"
          cd "$work"
          "$cli" init
          set +e; "$cli" doctor > doctor.log; set -e
          cat doctor.log
          grep -q "bundled NSIS" doctor.log
          nsis=$(ls -d "$ZEXORO_CACHE_DIR"/toolsets/nsis-*)
          mkdir -p "build/my app" assets
          cp "$nsis/Plugins/x86-unicode/System.dll" "build/my app/App.exe"
          cp "$nsis/Contrib/Graphics/Icons/modern-install.ico" assets/app.ico
          # MSYS_NO_PATHCONV keeps Git Bash on Windows from turning "/CN=..." into a path.
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes \
            -subj "/CN=zexoro smoke" -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out "it's a cert.pfx" -passout pass:smoke
          cat > zexoro.toml <<'TOML'
          [app]
          id = "com.example.smoke"
          name = "Smoke Test"
          version = "1.0.0"
          publisher = "zexoro"
          icon = "assets/app.ico"

          [input]
          dir = "build/my app"
          main = "App.exe"

          [windows]

          [windows.signing]
          certificate = "it's a cert.pfx"
          password = { env = "SMOKE_PASSWORD" }
          TOML
          SMOKE_PASSWORD=smoke "$cli" pack
          installer=dist/SmokeTest-1.0.0-win-x86.exe
          test -f "$installer"
          test "$(head -c 2 "$installer")" = "MZ"

      # End-to-end installers (docs/design/0003-mvp.md section 5), packed on every host; the
      # e2e-windows job installs each host's set on Windows.
      - name: Pack end-to-end installers
        shell: bash
        run: tests/e2e/pack.sh artifacts/publish/${{ matrix.rid }}/zexoro artifacts/e2e

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-installers-${{ matrix.os }}
          path: artifacts/e2e
          if-no-files-found: error

      # Independent checks of zexoro's Authenticode signatures. The fixture tool signs small PE
      # files with throwaway certificates (RSA, ECDSA, and an ECDSA leaf under an RSA CA chain).
      - name: Verify Authenticode signatures with osslsigncode
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          out=artifacts/signing
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- "$out"
          for exe in "$out"/*.exe; do
            name=$(basename "$exe")
            log="$exe.log"
            if ! osslsigncode verify -CAfile "$out/${name%%.*}.root.pem" -in "$exe" > "$log" 2>&1; then
              cat "$log"
              echo "::error::osslsigncode rejected $name" >&2
              exit 1
            fi
            if grep -q "invalid PE checksum" "$log"; then
              cat "$log"
              echo "::error::wrong PE checksum in $name" >&2
              exit 1
            fi
            echo "verified $name"
          done

      - name: Verify Authenticode signatures with Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts/signing'
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- $out artifacts/publish/${{ matrix.rid }}/zexoro.exe
          if ($LASTEXITCODE -ne 0) { throw "fixture signing failed" }
          $roots = Get-ChildItem "$out/*.root.cer" | ForEach-Object {
            Import-Certificate -FilePath $_.FullName -CertStoreLocation Cert:\LocalMachine\Root
          }
          try {
            $signed = @(Get-ChildItem "$out/*.exe")
            if ($signed.Count -lt 4) { throw "expected at least 4 signed files, found $($signed.Count)" }
            $failed = 0
            foreach ($exe in $signed) {
              $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
              if ($signature.Status -ne 'Valid') {
                Write-Host "::error::$($exe.Name): $($signature.Status) - $($signature.StatusMessage)"
                $failed++
              } else {
                Write-Host "verified $($exe.Name) ($($signature.SignerCertificate.Subject))"
              }
            }
            if ($failed -gt 0) { throw "$failed signature(s) not valid" }
          } finally {
            $roots | Remove-Item
          }

  e2e-windows:
    name: e2e on Windows (packed on ${{ matrix.host }})
    needs: build
    # Each host's installers are tested even when another host's build failed.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            powershell: pwsh
          - host: macos-latest
            powershell: pwsh
          # Windows PowerShell 5.1, the default shell of a Windows machine reached over SSH.
          - host: windows-latest
            powershell: powershell
    steps:
      - uses: actions/checkout@v5

      # The fixture app is framework-dependent and needs the .NET runtime.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: e2e-installers-${{ matrix.host }}
          path: e2e

      - name: Install, upgrade and uninstall
        shell: pwsh
        run: |
          & ${{ matrix.powershell }} -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows/Run-E2E.ps1 -InstallerDir e2e
          exit $LASTEXITCODE
