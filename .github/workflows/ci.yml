name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # zexoro-updater for every runtime identifier, published with Native AOT and embedded into every
  # CLI build (docs/design/0005-nsis-updates.md section 3, 0006-desktop-formats.md section 2).
  # Native AOT cross-compiles between architectures of one operating system only on Windows and
  # macOS, and Linux builds must link against an old C library, so each leg builds on a runner (and,
  # for Linux, in a container of an old distribution) of its own system and architecture:
  # eng/updater/publish.sh and publish-in-container.sh. The 'updater' job merges the legs.
  updater-build:
    name: updater (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            os: windows-latest
          - leg: linux-x64
            os: ubuntu-24.04
          - leg: linux-arm64
            os: ubuntu-24.04-arm
          - leg: osx-arm64
            os: macos-15
          - leg: osx-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        if: runner.os != 'Linux'
        with:
          global-json-file: global.json

      - name: Publish zexoro-updater (Native AOT)
        shell: bash
        run: |
          set -euo pipefail
          echo "### zexoro-updater (${{ matrix.leg }})" >> "$GITHUB_STEP_SUMMARY"
          case "${{ matrix.leg }}" in
            windows)
              for rid in win-x86 win-x64; do eng/updater/publish.sh "$rid" artifacts/updater; done
              # The runner is x64; win-arm64 is built but cannot run here.
              eng/updater/publish.sh win-arm64 artifacts/updater norun ;;
            linux-*)
              arch="${{ matrix.leg }}"; arch="${arch#linux-}"
              eng/updater/publish-in-container.sh "linux-$arch" artifacts/updater
              eng/updater/publish-in-container.sh "linux-musl-$arch" artifacts/updater ;;
            osx-*)
              eng/updater/publish.sh "${{ matrix.leg }}" artifacts/updater ;;
          esac
          ls -l artifacts/updater

      - name: Check the Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $machines = @{ 'win-x86' = 0x014C; 'win-x64' = 0x8664; 'win-arm64' = 0xAA64 }
          foreach ($rid in $machines.Keys) {
            $exe = "artifacts/updater/zexoro-updater-$rid.exe"
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne $machines[$rid]) { throw ("{0}: PE machine 0x{1:X4}" -f $rid, $machine) }
            # The manifest must say asInvoker, or Windows' installer detection elevates an
            # executable whose name contains 'update'.
            if (-not ([Text.Encoding]::ASCII.GetString($bytes).Contains('level="asInvoker"'))) { throw "$rid has no asInvoker manifest" }
            Write-Host "$rid ok ($($bytes.Length) bytes)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: updater-leg-${{ matrix.leg }}
          path: artifacts/updater
          if-no-files-found: error

  updater:
    name: updater
    needs: updater-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-leg-*
          path: artifacts/updater
          merge-multiple: true

      - name: Check and checksum every updater
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/updater
          expected="zexoro-updater-linux-arm64
          zexoro-updater-linux-musl-arm64
          zexoro-updater-linux-musl-x64
          zexoro-updater-linux-x64
          zexoro-updater-osx-arm64
          zexoro-updater-osx-x64
          zexoro-updater-win-arm64.exe
          zexoro-updater-win-x64.exe
          zexoro-updater-win-x86.exe"
          actual=$(ls | sort)
          if [ "$actual" != "$(echo "$expected" | sed 's/^ *//')" ]; then
            echo "::error::unexpected updater files:"$'\n'"$actual"
            exit 1
          fi
          file zexoro-updater-*
          sha256sum zexoro-updater-* > SHA256SUMS
          cat SHA256SUMS
          ls -l | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}
    needs: updater
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Toolset archives pinned in eng/toolsets.json, downloaded by the build (see eng/Toolsets.targets).
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/zexoro-toolsets
          key: zexoro-toolsets-${{ hashFiles('eng/toolsets.json') }}

      # The updaters published by the 'updater' job, embedded by eng/Updater.targets.
      - uses: actions/download-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater

      - name: Build
        run: dotnet build -c Release -p:ZexoroUpdaterDir=artifacts/updater -p:ZexoroUpdaterRequired=true

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish CLI (Native AOT)
        run: >
          dotnet publish src/Zexoro.Cli -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}
          -p:ZexoroUpdaterDir=artifacts/updater -p:ZexoroUpdaterRequired=true

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=artifacts/publish/${{ matrix.rid }}/zexoro
          "$cli" --version
          "$cli" --help
          if "$cli" --bogus; then
            echo "expected a non-zero exit code for unknown arguments" >&2
            exit 1
          fi
          cli="$PWD/$cli"
          work="$(mktemp -d)"
          cd "$work"
          "$cli" init
          test -f zexoro.toml
          set +e
          "$cli" doctor
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected doctor to exit 1 for a fresh template (missing input files), got $status" >&2
            exit 1
          fi

      # Packs and signs an installer with the Native AOT binary, which extracts its embedded NSIS
      # toolset and calls itself back (sign-file) from makensis. Any small PE file serves as the app.
      - name: Smoke test pack
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/artifacts/publish/${{ matrix.rid }}/zexoro"
          work="$(mktemp -d)"
          export ZEXORO_CACHE_DIR="$work/cache"
          cd "$work"
          "$cli" init
          set +e; "$cli" doctor > doctor.log; set -e
          cat doctor.log
          grep -q "bundled NSIS" doctor.log
          for rid in win-x86 win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64; do
            grep -Eq "^ok +bundled updater for $rid " doctor.log
          done
          nsis=$(ls -d "$ZEXORO_CACHE_DIR"/toolsets/nsis-*)
          mkdir -p "build/my app" assets
          cp "$nsis/Plugins/x86-unicode/System.dll" "build/my app/App.exe"
          cp "$nsis/Contrib/Graphics/Icons/modern-install.ico" assets/app.ico
          # MSYS_NO_PATHCONV keeps Git Bash on Windows from turning "/CN=..." into a path.
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 2 -nodes \
            -subj "/CN=zexoro smoke" -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out "it's a cert.pfx" -passout pass:smoke
          cat > zexoro.toml <<'TOML'
          [app]
          id = "com.example.smoke"
          name = "Smoke Test"
          version = "1.0.0"
          publisher = "zexoro"
          icon = "assets/app.ico"

          [input]
          dir = "build/my app"
          main = "App.exe"

          [windows]

          [windows.signing]
          certificate = "it's a cert.pfx"
          password = { env = "SMOKE_PASSWORD" }
          TOML
          SMOKE_PASSWORD=smoke "$cli" pack
          installer=dist/SmokeTest-1.0.0-win-x86.exe
          test -f "$installer"
          test "$(head -c 2 "$installer")" = "MZ"

      # The host's zexoro-updater against a local feed: check, download and apply of a tar.gz
      # (docs/design/0006-desktop-formats.md section 2). On Linux the musl build runs in Alpine too.
      - name: Smoke test zexoro-updater
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cli=artifacts/publish/${{ matrix.rid }}/zexoro
          tests/e2e/unix/check-updater.sh "$cli" artifacts/updater/zexoro-updater-${{ matrix.rid }}
          if [ "$RUNNER_OS" = Linux ]; then
            export TMPDIR=/tmp
            tests/e2e/unix/check-updater.sh "$cli" artifacts/updater/zexoro-updater-linux-musl-x64 \
              docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME -e XDG_STATE_HOME -e TMPDIR -v /tmp:/tmp alpine:3.21
          fi

      # End-to-end installers and portable zips (docs/design/0003-mvp.md section 5,
      # 0006-desktop-formats.md section 5), packed on every host; the e2e-windows job tests each
      # host's set on Windows.
      - name: Pack end-to-end installers
        shell: bash
        run: tests/e2e/pack.sh artifacts/publish/${{ matrix.rid }}/zexoro artifacts/e2e

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-installers-${{ matrix.os }}
          path: artifacts/e2e
          if-no-files-found: error

      # Independent checks of zexoro's Authenticode signatures. The fixture tool signs small PE
      # files with throwaway certificates (RSA, ECDSA, and an ECDSA leaf under an RSA CA chain).
      - name: Verify Authenticode signatures with osslsigncode
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          out=artifacts/signing
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- "$out"
          for exe in "$out"/*.exe; do
            name=$(basename "$exe")
            log="$exe.log"
            if ! osslsigncode verify -CAfile "$out/${name%%.*}.root.pem" -in "$exe" > "$log" 2>&1; then
              cat "$log"
              echo "::error::osslsigncode rejected $name" >&2
              exit 1
            fi
            if grep -q "invalid PE checksum" "$log"; then
              cat "$log"
              echo "::error::wrong PE checksum in $name" >&2
              exit 1
            fi
            echo "verified $name"
          done

      - name: Verify Authenticode signatures with Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts/signing'
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- $out artifacts/publish/${{ matrix.rid }}/zexoro.exe
          if ($LASTEXITCODE -ne 0) { throw "fixture signing failed" }
          $roots = Get-ChildItem "$out/*.root.cer" | ForEach-Object {
            Import-Certificate -FilePath $_.FullName -CertStoreLocation Cert:\LocalMachine\Root
          }
          try {
            $signed = @(Get-ChildItem "$out/*.exe")
            if ($signed.Count -lt 4) { throw "expected at least 4 signed files, found $($signed.Count)" }
            $failed = 0
            foreach ($exe in $signed) {
              $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
              if ($signature.Status -ne 'Valid') {
                Write-Host "::error::$($exe.Name): $($signature.Status) - $($signature.StatusMessage)"
                $failed++
              } else {
                Write-Host "verified $($exe.Name) ($($signature.SignerCertificate.Subject))"
              }
            }
            if ($failed -gt 0) { throw "$failed signature(s) not valid" }
          } finally {
            $roots | Remove-Item
          }

  e2e-windows:
    name: e2e on Windows (packed on ${{ matrix.host }})
    needs: build
    # Each host's installers are tested even when another host's build failed.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            powershell: pwsh
          - host: macos-latest
            powershell: pwsh
          # Windows PowerShell 5.1, the default shell of a Windows machine reached over SSH.
          - host: windows-latest
            powershell: powershell
    steps:
      - uses: actions/checkout@v5

      # The fixture app is framework-dependent and needs the .NET runtime.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: e2e-installers-${{ matrix.host }}
          path: e2e

      - name: Install, upgrade and uninstall
        shell: pwsh
        run: |
          & ${{ matrix.powershell }} -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows/Run-E2E.ps1 -InstallerDir e2e
          exit $LASTEXITCODE

      # zexoro-updater check/download/apply against a local feed server, both scopes, plus the
      # verification failures (docs/design/0005-nsis-updates.md section 4). Runs even when the
      # step above failed, so both results are visible.
      - name: Automatic updates
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ${{ matrix.powershell }} -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows/Run-UpdateE2E.ps1 -InstallerDir e2e
          exit $LASTEXITCODE

      # The portable zip: extract, run, and the shared update scenario of
      # docs/design/0006-desktop-formats.md section 5, plus a folder that is not writable (exit 7).
      - name: Portable zip
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          & ${{ matrix.powershell }} -NoProfile -ExecutionPolicy Bypass -File tests/e2e/windows/Run-ZipE2E.ps1 -InstallerDir e2e
          exit $LASTEXITCODE

  # The portable tar.gz on both Linux architectures: extract with the system's tar, run, and the
  # shared update scenario of docs/design/0006-desktop-formats.md section 5, plus a directory that
  # is not writable (exit 7), for each pack host's archives. Then the deb packages: dpkg-deb
  # checks, install with apt, the notify scenario, upgrade, remove and purge, on the runner and in
  # a debian:stable container (with lintian). Then the rpm packages in Fedora, Rocky Linux and
  # openSUSE Leap containers, and the apk packages in Alpine containers (apk-tools 2 and 3).
  e2e-linux:
    name: e2e on ${{ matrix.os }} (packed on ${{ matrix.host }})
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        host: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # The fixture app is framework-dependent and needs the .NET runtime.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: e2e-installers-${{ matrix.host }}
          path: e2e

      - name: Portable tar.gz
        run: tests/e2e/unix/run-tar-e2e.sh e2e

      - name: deb on the runner (dpkg, apt)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-deb-e2e.sh e2e

      # A minimal Debian: apt resolves the package's Depends (OpenSSL for the updater). The runner's
      # .NET is mounted for the framework-dependent fixture app.
      - name: deb in debian:stable (apt, lintian)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet_root="${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}"
          docker run --rm -v "$PWD:/w" -w /w -v "$dotnet_root:/opt/dotnet:ro" -e DOTNET_ROOT=/opt/dotnet debian:stable bash -c '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 curl lintian > /dev/null
            cat /etc/debian_version
            lintian --version
            tests/e2e/unix/run-deb-e2e.sh e2e'

      # rpm packages in containers of three rpm distributions (docs/design/0006-desktop-formats.md
      # section 5): rpm -K, rpmkeys, gpg --verify on the extracted header signature, install with
      # dnf or zypper, the notify scenario, upgrade and remove. Fedora runs with
      # %_pkgverify_level all, the default RPM 6 announced, and also runs rpmlint.
      - name: rpm in fedora:latest (dnf, RPM 6 enforcement, rpmlint)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-rpm-in-container.sh fedora:latest e2e enforce

      - name: rpm in rockylinux:9 (dnf, rpm 4.16)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-rpm-in-container.sh rockylinux:9 e2e

      - name: rpm in opensuse/leap (zypper)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-rpm-in-container.sh opensuse/leap:latest e2e

      # apk packages in Alpine (docs/design/0006-desktop-formats.md section 5): alpine:3.22 has
      # apk-tools 2, alpine:latest apk-tools 3. The fixture app is framework-dependent and built for
      # linux-musl, so a .NET runtime for musl of the runner's version is mounted (test-only download).
      - name: .NET runtime for musl
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version=$(dotnet --list-runtimes | sed -n 's/^Microsoft\.NETCore\.App \([^ ]*\) .*/\1/p' | sort -V | tail -1)
          curl -sSfL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --os linux-musl --version "$version" --install-dir "$RUNNER_TEMP/dotnet-musl" --no-path

      - name: apk in alpine:3.22 (apk-tools 2)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-apk-in-container.sh alpine:3.22 e2e "$RUNNER_TEMP/dotnet-musl"

      - name: apk in alpine:latest (apk-tools 3)
        if: ${{ !cancelled() }}
        run: tests/e2e/unix/run-apk-in-container.sh alpine:latest e2e "$RUNNER_TEMP/dotnet-musl"

  # The macOS zip (docs/design/0006-desktop-formats.md section 5) on both macOS architectures:
  # codesign needs the runner's own keychain, so each runner publishes its own CLI and packs there,
  # signed with a self-signed certificate in a temporary keychain; then ditto -x -k, codesign
  # --verify --deep --strict, Info.plist, the record, the updater's architectures, launching the
  # app, the bundled updater, ad-hoc signing and [updates] refused without [macos.signing].
  e2e-macos:
    name: e2e on ${{ matrix.os }} (macOS zip)
    needs: updater
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/zexoro-toolsets
          key: zexoro-toolsets-${{ hashFiles('eng/toolsets.json') }}

      - uses: actions/download-artifact@v4
        with:
          name: updater-binaries
          path: artifacts/updater

      - name: Publish CLI (Native AOT)
        run: >
          dotnet publish src/Zexoro.Cli -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}
          -p:ZexoroUpdaterDir=artifacts/updater -p:ZexoroUpdaterRequired=true

      - name: macOS zip
        run: tests/e2e/macos/run-bundle-e2e.sh artifacts/publish/${{ matrix.rid }}/zexoro

  # A zip, a tar.gz, a deb, a signed rpm and a signed apk of fixed files must have the same bytes
  # whichever host packed them (docs/design/0006-desktop-formats.md section 5).
  reproducible:
    name: zip, tar.gz, deb, rpm and apk are reproducible across hosts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-installers-*
          path: e2e

      - name: Compare the repro archives
        shell: bash
        run: |
          set -euo pipefail
          for ext in zip tar.gz deb rpm apk; do
            sha256sum e2e/*/repro/*.$ext
            count=$(ls e2e/*/repro/*.$ext | wc -l)
            test "$count" -eq 3 || { echo "::error::expected 3 repro $ext archives, found $count"; exit 1; }
            distinct=$(sha256sum e2e/*/repro/*.$ext | cut -d' ' -f1 | sort -u | wc -l)
            test "$distinct" -eq 1 || { echo "::error::the repro $ext differs between pack hosts"; exit 1; }
          done
          tar -tzvf "$(ls e2e/*/repro/*.tar.gz | head -1)" --numeric-owner --utc
          dpkg-deb --info "$(ls e2e/*/repro/*.deb | head -1)"
          dpkg-deb --contents "$(ls e2e/*/repro/*.deb | head -1)"
          docker run --rm -v "$PWD/e2e:/e2e:ro" fedora:latest bash -c 'f="$(ls /e2e/*/repro/*.rpm | head -1)"; rpm -qip "$f"; rpm -qlvp "$f"; rpm -K -v "$f" || true'
          tar -tzvf "$(ls e2e/*/repro/*.apk | head -1)" --numeric-owner --utc
