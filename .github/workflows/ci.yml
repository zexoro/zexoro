name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish CLI (Native AOT)
        run: dotnet publish src/Zexoro.Cli -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          cli=artifacts/publish/${{ matrix.rid }}/zexoro
          "$cli" --version
          "$cli" --help
          if "$cli" --bogus; then
            echo "expected a non-zero exit code for unknown arguments" >&2
            exit 1
          fi

      # Independent checks of zexoro's Authenticode signatures. The fixture tool signs small PE
      # files with throwaway certificates (RSA, ECDSA, and an ECDSA leaf under an RSA CA chain).
      - name: Verify Authenticode signatures with osslsigncode
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          out=artifacts/signing
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- "$out"
          for exe in "$out"/*.exe; do
            name=$(basename "$exe")
            log="$exe.log"
            if ! osslsigncode verify -CAfile "$out/${name%%.*}.root.pem" -in "$exe" > "$log" 2>&1; then
              cat "$log"
              echo "::error::osslsigncode rejected $name" >&2
              exit 1
            fi
            if grep -q "invalid PE checksum" "$log"; then
              cat "$log"
              echo "::error::wrong PE checksum in $name" >&2
              exit 1
            fi
            echo "verified $name"
          done

      - name: Verify Authenticode signatures with Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'artifacts/signing'
          dotnet run --project tests/Zexoro.Signing.Fixtures -c Release --no-build -- $out artifacts/publish/${{ matrix.rid }}/zexoro.exe
          if ($LASTEXITCODE -ne 0) { throw "fixture signing failed" }
          $roots = Get-ChildItem "$out/*.root.cer" | ForEach-Object {
            Import-Certificate -FilePath $_.FullName -CertStoreLocation Cert:\LocalMachine\Root
          }
          try {
            $failed = 0
            foreach ($exe in Get-ChildItem "$out/*.exe") {
              $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
              if ($signature.Status -ne 'Valid') {
                Write-Host "::error::$($exe.Name): $($signature.Status) - $($signature.StatusMessage)"
                $failed++
              } else {
                Write-Host "verified $($exe.Name) ($($signature.SignerCertificate.Subject))"
              }
            }
            if ($failed -gt 0) { throw "$failed signature(s) not valid" }
          } finally {
            $roots | Remove-Item
          }
